 # Endereço do banco de dados
 spring.datasource.url=jdbc:mysql://localhost:3306/techos

 # usuario do banco de dados
 spring.datasource.username=root
 # senha do banco de dados
 spring.datasource.password=

 # update: o Spring JPA irá atualizar o banco de dados automaticamente com base nas entidades definidas
 spring.jpa.hibernate.ddl-auto=update

 # Mostra o terminal SQL gerado pelo Hibernate
 spring.jpa.show-sql=true